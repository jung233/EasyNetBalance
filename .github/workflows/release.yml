name: Windows build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

env:
  MIHOMO_REPOSITORY: MetaCubeX/mihomo
  MIHOMO_TAG: v1.19.31
  MIHOMO_COMMIT: ab405bad5beeeac8b003bb01f60f134f6df54471

jobs:
  build:
    name: Build EasyNetBalance and patched Mihomo
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out EasyNetBalance
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/EasyBalance.UI/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
          cache-dependency-path: third_party/mihomo/go.sum

      - name: Install frontend dependencies
        working-directory: src/EasyBalance.UI
        run: npm ci

      - name: Build the pinned, patched Mihomo core and corresponding source
        id: mihomo
        shell: pwsh
        run: |
          & .\scripts\build-mihomo.ps1 `
            -SourceRoot '.\third_party\mihomo' `
            -TauriRoot '.\src\EasyBalance.UI\src-tauri' `
            -SourceArchivePath (Join-Path $env:RUNNER_TEMP "mihomo-$env:MIHOMO_TAG-source.tar.gz")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the frontend
        working-directory: src/EasyBalance.UI
        run: npm run build

      - name: Validate generated Rust lockfile
        shell: pwsh
        run: |
          & cargo generate-lockfile --manifest-path '.\src\EasyBalance.UI\src-tauri\Cargo.toml'
          if ($LASTEXITCODE -ne 0) { throw 'Cargo could not generate the Rust lockfile.' }
          if (-not (Test-Path -LiteralPath '.\src\EasyBalance.UI\src-tauri\Cargo.lock' -PathType Leaf)) { throw 'Cargo.lock was not generated.' }
          & cargo check --locked --manifest-path '.\src\EasyBalance.UI\src-tauri\Cargo.toml'
          if ($LASTEXITCODE -ne 0) { throw 'Rust application failed cargo check --locked.' }

      - name: Collect Rust dependency notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = '.\src\EasyBalance.UI\src-tauri\Cargo.toml'
          $lockPath = '.\src\EasyBalance.UI\src-tauri\Cargo.lock'
          if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) {
            & cargo generate-lockfile --manifest-path $manifest
            if ($LASTEXITCODE -ne 0) { throw 'Cargo could not resolve the Rust dependency lockfile.' }
          }
          $metadataJson = & cargo metadata --format-version 1 --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed while collecting dependency licenses.' }
          $metadata = ($metadataJson -join "`n") | ConvertFrom-Json -Depth 100
          $noticeRoot = Join-Path $env:GITHUB_WORKSPACE 'src\EasyBalance.UI\src-tauri\resources\notices\licenses\rust'
          New-Item -ItemType Directory -Force -Path $noticeRoot | Out-Null
          $inventory = [System.Collections.Generic.List[string]]::new()
          $missing = [System.Collections.Generic.List[string]]::new()
          foreach ($package in $metadata.packages | Where-Object { $_.source -like 'registry+*' }) {
            $packageRoot = Split-Path -Parent $package.manifest_path
            $safeName = ([string]$package.name -replace '[^A-Za-z0-9._-]', '_') + '-' + [string]$package.version
            $licenseFiles = @(Get-ChildItem -LiteralPath $packageRoot -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE)([._-].*)?$' })
            if ($licenseFiles.Count -eq 0) {
              $licenseDirectories = @(Get-ChildItem -LiteralPath $packageRoot -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(licenses?|licensing)$' })
              foreach ($licenseDirectory in $licenseDirectories) {
                $licenseFiles += @(Get-ChildItem -LiteralPath $licenseDirectory.FullName -File -Recurse -Depth 3 -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE)([._-].*)?$' })
              }
            }
            $expression = [string]$package.license
            if ([string]::IsNullOrWhiteSpace($expression)) { $expression = [string]$package.license_file }
            if ([string]::IsNullOrWhiteSpace($expression) -and $licenseFiles.Count -gt 0) { $expression = 'See bundled license text: ' + (($licenseFiles | ForEach-Object { $_.Name }) -join ', ') }
            if ([string]::IsNullOrWhiteSpace($expression)) { $missing.Add("$($package.name) $($package.version) (license metadata missing)") }
            $inventory.Add("$($package.name) $($package.version) — $expression")
          if ($licenseFiles.Count -eq 0 -and [string]::IsNullOrWhiteSpace($expression)) { $missing.Add("$($package.name) $($package.version) (license files and metadata missing)") }
            foreach ($licenseFile in $licenseFiles) {
              $relativeLicensePath = $licenseFile.FullName.Substring($packageRoot.Length).TrimStart([char[]]@([char]'\', [char]'/'))
              $safeLicensePath = $relativeLicensePath -replace '[\\/]', '_'
              Copy-Item -LiteralPath $licenseFile.FullName -Destination (Join-Path $noticeRoot ($safeName + '-' + $safeLicensePath)) -Force
            }
          }
          if ($missing.Count -gt 0) { throw "Rust dependencies with incomplete license metadata: $($missing -join ', ')" }
          $inventory | Sort-Object -Unique | Set-Content -LiteralPath (Join-Path $noticeRoot 'RUST-DEPENDENCIES.txt') -Encoding utf8
          $tauriPackage = @($metadata.packages | Where-Object { $_.name -ceq 'tauri' })
          if ($tauriPackage.Count -ne 1 -or $tauriPackage[0].license -notmatch 'Apache-2\.0' -or $tauriPackage[0].license -notmatch 'MIT') {
            throw 'The resolved Tauri crate is not dual-licensed under MIT and Apache-2.0 as expected.'
          }

      - name: Preserve the resolved Rust dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: easynetbalance-cargo-lock-${{ github.run_id }}
          path: src/EasyBalance.UI/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 30

      - name: Collect npm dependency notices
        shell: pwsh
        run: |
          & .\scripts\collect-npm-licenses.ps1 `
            -PackageRoot '.\src\EasyBalance.UI' `
            -Destination '.\src\EasyBalance.UI\src-tauri\resources\notices\licenses\npm'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the per-machine NSIS installer
        working-directory: src/EasyBalance.UI
        run: npm run tauri -- build --ci

      - name: Stage installer, source, notices, and checksums
        id: package
        shell: pwsh
        env:
          MIHOMO_SOURCE_ARCHIVE: ${{ steps.mihomo.outputs.mihomo_source_archive }}
          MIHOMO_SOURCE_SHA256: ${{ steps.mihomo.outputs.mihomo_source_sha256 }}
          MIHOMO_BINARY_SHA256: ${{ steps.mihomo.outputs.mihomo_binary_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisRoot = Join-Path $env:GITHUB_WORKSPACE 'src\EasyBalance.UI\src-tauri\target\release\bundle\nsis'
          $installers = @(Get-ChildItem -LiteralPath $nsisRoot -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one Tauri NSIS setup EXE; found $($installers.Count)." }
          if (-not (Test-Path -LiteralPath $env:MIHOMO_SOURCE_ARCHIVE -PathType Leaf)) { throw 'The matching patched Mihomo source archive was not produced.' }
          $corePath = Join-Path $env:GITHUB_WORKSPACE 'src\EasyBalance.UI\src-tauri\resources\core\mihomo.exe'
          if ((Get-FileHash -LiteralPath $env:MIHOMO_SOURCE_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:MIHOMO_SOURCE_SHA256) { throw 'The Mihomo source archive hash changed after source generation.' }
          if ((Get-FileHash -LiteralPath $corePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:MIHOMO_BINARY_SHA256) { throw 'The staged Mihomo executable hash changed before packaging.' }

          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $releaseTag = "v0.2.0-preview.$env:GITHUB_RUN_NUMBER"
          } elseif (([string]$env:GITHUB_REF).StartsWith('refs/tags/')) {
            $releaseTag = $env:GITHUB_REF_NAME
          } else {
            $releaseTag = "ci-$env:GITHUB_RUN_NUMBER"
          }
          $assetTag = $releaseTag -replace '[^0-9A-Za-z._-]', '-'
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          $setupPath = Join-Path $releaseRoot "EasyNetBalance-$assetTag-win-x64-setup.exe"
          $sourcePath = Join-Path $releaseRoot "mihomo-$env:MIHOMO_TAG-source.tar.gz"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $setupPath -Force
          Copy-Item -LiteralPath $env:MIHOMO_SOURCE_ARCHIVE -Destination $sourcePath -Force

          $resourcesRoot = Join-Path $env:GITHUB_WORKSPACE 'src\EasyBalance.UI\src-tauri\resources'
          Copy-Item -LiteralPath (Join-Path $resourcesRoot 'notices\MIHOMO-SOURCE.txt') -Destination (Join-Path $releaseRoot 'MIHOMO-SOURCE.txt') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'THIRD_PARTY_NOTICES.md') -Destination (Join-Path $releaseRoot 'THIRD_PARTY_NOTICES.md') -Force
          $hashes = @(Get-ChildItem -LiteralPath $releaseRoot -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))" })
          $hashes | Set-Content -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt') -Encoding ascii
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: easynetbalance-release-${{ github.run_id }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview.')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: easynetbalance-release-${{ github.run_id }}
          path: release-artifacts

      - name: Publish EasyNetBalance installer and matching Mihomo source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $releaseTag = "v0.2.0-preview.$env:GITHUB_RUN_NUMBER"
          } else {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          $assets = @(Get-ChildItem -LiteralPath '.\release-artifacts' -File | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 4) { throw "Expected installer, source, provenance, notices and checksums; found $($assets.Count) release assets." }
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            gh release create $releaseTag $assets --repo $env:GITHUB_REPOSITORY `
              --title "EasyNetBalance $releaseTag" --generate-notes --prerelease --target $env:GITHUB_SHA
          } else {
            gh release create $releaseTag $assets --repo $env:GITHUB_REPOSITORY `
              --title "EasyNetBalance $releaseTag" --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed with exit code $LASTEXITCODE." }
